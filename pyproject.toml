[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modeling-module"
version = "0.2.0"
description = "Reusable time-series forecasting training and inference library"
readme = "README.package.md"
requires-python = ">=3.10"
keywords = ["forecasting", "time-series", "deep-learning", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24,<2.2",
    "pandas>=2.0,<2.4",
    "polars>=1.0,<2.0",
    "pyarrow>=14,<24",
    "PyYAML>=6,<7",
    "scikit-learn>=1.3,<1.8",
    "scipy>=1.10,<1.18",
    "statsmodels>=0.14,<0.15",
    "torch",
    "tqdm>=4.66,<5",
    "fsspec>=2023.1.0,<=2026.2.0",
]

[project.optional-dependencies]
dev = [
    "build>=1",
    "loguru",
    "packaging>=24",
    "pytest>=8",
    "rich",
    "tomli>=2; python_version < '3.11'",
    "twine>=5",
    "wheel>=0.45",
]
notebook = [
    "ipykernel",
    "jupyterlab",
    "matplotlib",
]
plot = [
    "matplotlib",
]
survival = [
    "lifelines",
]
sellm = [
    "accelerate>=0.33",
    "safetensors>=0.4",
    "tokenizers>=0.20",
    "transformers>=4.45,<6",
]
all = [
    "ipykernel",
    "jupyterlab",
    "matplotlib",
    "lifelines",
    "accelerate>=0.33",
    "safetensors>=0.4",
    "tokenizers>=0.20",
    "transformers>=4.45,<6",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["modeling_module*"]

[tool.setuptools.package-data]
"modeling_module.models.TimeMixer" = ["LICENSE.upstream", "upstream_manifest.json"]

[tool.setuptools.exclude-package-data]
"*" = ["*.pyc", "*.pyo", ".DS_Store"]

[tool.pytest.ini_options]
testpaths = ["tests"]
