name: ts_forecaster_5090_sellm
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip>=25
  - numpy>=1.24,<2.2
  - pandas>=2.0,<2.4
  - polars>=1.0,<2.0
  - pyarrow>=14,<24
  - pyyaml>=6,<7
  - scikit-learn>=1.3,<1.8
  - scipy>=1.10,<1.18
  - statsmodels>=0.14,<0.15
  - tqdm>=4.66,<5
  - pip:
      # Prefer CUDA 13.x wheels for RTX 5090 / Blackwell-class servers.
      - --extra-index-url https://download.pytorch.org/whl/cu130
      - torch
      - torchvision
      - torchaudio
      - -e .[sellm]
      # Optional API serving stack for a warm-loaded Docker forecast engine.
      - fastapi>=0.115
      - uvicorn[standard]>=0.30
